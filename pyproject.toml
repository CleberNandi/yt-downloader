[project]
name = "yt-downloader"
version = "0.2.0"
description = "Modern YouTube video, audio, and playlist downloader powered by yt-dlp, Typer, and Rich."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "yt-dlp>=2025.1.0",
  "typer>=0.15.0",
  "rich>=13.9.0",
]

[project.scripts]
ytdl = "yt_downloader.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.9.0",
  "pyright>=1.1.390",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yt_downloader"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v"]
